<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión - GiroVolt</title>
    <link rel="stylesheet" href="estilo2.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>

<body>


    <div class="logo">
        <img src="imagenes/Logo con solo nombre.png" alt="Logo" width="600" height="500" id="logo">
    </div>

    <div class="selector">
        <button type="button" id="btnLogin" class="activo" aria-pressed="true"
            onclick="mostrarFormulario('login')">Iniciar sesión</button>
        <button type="button" id="btnRegistro" aria-pressed="false"
            onclick="mostrarFormulario('registro')">Registrarse</button>
    </div>

    <div class="padre">
        <div class="hijo" id="panelLogin">
            <center>
                <h1>Iniciar sesión</h1>
            </center>

            <center>
                <form onsubmit="iniciarSesion(event)">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" required>
                    <br><br>

                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                    <br><br>

                    <input type="submit" value="Iniciar sesión">
                </form>
            </center>
        </div>

        <div class="hijo2" id="panelRegistro" hidden>
            <center>
                <h1>Registro</h1>

                <label>Usuario:</label>
                <input type="text" id="usuarioRegistro">
                <br><br>

                <label>Correo:</label>
                <input type="email" id="correoRegistro">
                <br><br>

                <label>Contraseña:</label>
                <input type="password" id="contrasenaRegistro">
                <br><br>

                <label>Confirmar contraseña:</label>
                <input type="password" id="confirmarRegistro">
                <br><br>

                <button onclick="registrar()">
                    Registrarse
                </button>
            </center>
        </div>
    </div>

    <script>
        function mostrarFormulario(cual) {
            let esLogin = cual == "login";

            document.getElementById("panelLogin").hidden = !esLogin;
            document.getElementById("panelRegistro").hidden = esLogin;

            let btnLogin = document.getElementById("btnLogin");
            let btnRegistro = document.getElementById("btnRegistro");

            btnLogin.classList.toggle("activo", esLogin);
            btnRegistro.classList.toggle("activo", !esLogin);
            btnLogin.setAttribute("aria-pressed", esLogin);
            btnRegistro.setAttribute("aria-pressed", !esLogin);
        }

        function registrar() {
            let usuario = document.getElementById("usuarioRegistro").value;
            let correo = document.getElementById("correoRegistro").value;
            let contrasena = document.getElementById("contrasenaRegistro").value;
            let confirmar = document.getElementById("confirmarRegistro").value;

            if (
                usuario == "" ||
                correo == "" ||
                contrasena == "" ||
                confirmar == ""
            ) {
                alert("Debe llenar todos los campos");
                return;
            }

            if (contrasena != confirmar) {
                alert("Las contraseñas no coinciden");
                return;
            }

            let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

            let usuarioExiste = usuarios.find(function (user) {
                return user.usuario == usuario;
            });

            if (usuarioExiste) {
                alert("Ese usuario ya existe");
                return;
            }

            let nuevoUsuario = {
                usuario: usuario,
                correo: correo,
                contrasena: contrasena
            };

            usuarios.push(nuevoUsuario);

            localStorage.setItem("usuarios", JSON.stringify(usuarios));

            alert("Usuario registrado correctamente");
            mostrarFormulario("login");

            document.getElementById("usuarioRegistro").value = "";
            document.getElementById("correoRegistro").value = "";
            document.getElementById("contrasenaRegistro").value = "";
            document.getElementById("confirmarRegistro").value = "";
        }

        function iniciarSesion(event) {
            event.preventDefault();

            let usuario = document.getElementById("username").value;
            let contrasena = document.getElementById("password").value;

            let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

            let usuarioEncontrado = usuarios.find(function (user) {
                return user.usuario == usuario &&
                    user.contrasena == contrasena;
            });

            if (usuarioEncontrado) {
                alert("Inicio de sesión correcto");
                window.location.href = "index2.html";
            } else {
                alert("Usuario o contraseña incorrectos");
            }
        }
    </script>

    <div class="contacto">
        <div class="cont">
            <div id="log"></div>
            <div id="contactos">
                <h1>Contactos</h1>
                <br>
                <a class="flex contact-card" href="https://www.instagram.com/girovolt_gt/" target="_blank"
                    rel="noopener noreferrer" aria-label="Visitar Instagram de GiroVolt">
                    <div>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/2/28/Instagram_logo.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
                            alt="Instagram" width="30" height="30">
                    </div>
                    <div>
                        <p>Instagram: <span class="contact-handle">@girovolt_gt</span></p>
                    </div>
                </a>
                <a class="flex contact-card" href="https://www.tiktok.com/@girovolt_gt?is_from_webapp=1&amp;sender_device=pc"
                    target="_blank" rel="noopener noreferrer" aria-label="Visitar TikTok de GiroVolt">
                    <div>
                        <img src="https://tse4.mm.bing.net/th/id/OIP.mMBQtkeALKPcz_UcbngMIAAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"
                            alt="TikTok" width="30" height="30">
                    </div>
                    <div>
                        <p>TikTok: <span class="contact-handle">@girovolt_gt</span></p>
                    </div>
                </a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
