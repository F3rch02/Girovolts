<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girovolt</title>
    <link rel="stylesheet" href="estilo.css">
    </link>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div>
        <nav class="navbar sm:navbar-expand bg-1 fg-2">
            <div class="container-fluid">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKWsf-jgUHReFLRcGTprJlFxvOh4xENEjn0FIqRZdriQ&s=10"
                    alt="Logo" width="80" height="80" class="d-inline-block align-text-top">
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
                <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavAltMarkup"
                    aria-labelledby="navbarNavAltMarkupLabel">
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="navbarNavAltMarkupLabel">Menu</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>
                    <div class="drawer-body">
                        <div class="nav nav-pills navbar-nav">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                            <a class="nav-link" href="#">Features</a>
                            <a class="nav-link" href="#">Pricing</a>
                            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                        </div>
                    </div>
                </dialog>
            </div>
        </nav>
    </div>
    <div class="inicio">
        <div class="informacion">
            <h1 id="presentamos">PRESENTAMOS</h1>
            <h1 class="girovolt"><b>GiroVolt</b></h1>
            <p id="slogan">Moviendo el futuro sin contaminar el presente</p>
            <div id="boton">
                <button type="button" class="btn-solid theme-primary"
                    style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">
                    Sobre Nosotros
                </button>
            </div>
        </div>
        <div class="logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKWsf-jgUHReFLRcGTprJlFxvOh4xENEjn0FIqRZdriQ&s=10"
                alt="Logo" width="80" height="80">
        </div>
    </div>

    <script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
