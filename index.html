<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girovolt</title>
    <link rel="stylesheet" href="estilo.css">
    </link>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="navbar-seguimiento">
        <nav class="navbar sm:navbar-expand bg-1 fg-2">
            <div class="container-fluid">
                <img src="imagenes/Captura de pantalla 2026-10-21 111720.png" alt="Logo" width="80" height="80"
                    class="d-inline-block align-text-top">
                <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon" aria-hidden="true"></span>
                </button>
                <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavAltMarkup"
                    aria-labelledby="navbarNavAltMarkupLabel">
                    <div class="drawer-header">
                        <h5 class="drawer-title" id="navbarNavAltMarkupLabel">Menu</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                    </div>
                    <div class="drawer-body">
                        <div class="nav nav-pills navbar-nav">
                            <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                            <a class="nav-link" href="#">Nosotros</a>
                            <a class="nav-link" href="#">Productos</a>
                            <a class="nav-link" href="#">Inicio de sesión</a>
                        </div>
                    </div>
                </dialog>
            </div>
        </nav>
    </div>
    <div class="inicio">
        <div class="informacion">
            <h1 id="presentamos">PRESENTAMOS</h1>
            <h1 class="girovolt"><b>GiroVolt</b></h1>
            <p id="slogan">Moviendo el futuro sin contaminar el presente</p>
            <div id="boton">
                <button type="button" class="btn-solid theme-primary"
                    style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">
                    Sobre Nosotros
                </button>
            </div>
        </div>
        <div class="logo">
            <img src="imagenes/Gemini_Generated_Image_bt5ra6bt5ra6bt5r.png" alt="Logo" width="700" height="400">
        </div>
    </div>
    <div class="contacto">
        <div class="cont">
            <div id="log">

            </div>
            <div id="contactos">
                <h1>Contactos</h1>
                <br>
                <div class="flex">
                    <div>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/2/28/Instagram_logo.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"
                            alt="Instagram" width="30" height="30">
                    </div>
                    <div>
                        <p>Instagram: @girovolt</p>
                    </div>
                </div>
                <div>
                    <img src="" alt="">
                </div>
                <div>
                    <p>TikTok: Girovolt</p>
                </div>


            </div>
        </div>
    </div>
    <script type="module"
        src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
