<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión - GiroVolt</title>
    <link rel="stylesheet" href="estilo2.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>

<body class="pie-abajo">


    <div class="logo">
        <img src="imagenes/Logo con solo nombre.png" alt="Logo" width="600" height="500" id="logo">
    </div>

    <div class="selector">
        <button type="button" id="btnLogin" class="activo" aria-pressed="true"
            onclick="mostrarFormulario('login')">Iniciar sesión</button>
        <button type="button" id="btnRegistro" aria-pressed="false"
            onclick="mostrarFormulario('registro')">Registrarse</button>
    </div>

    <div class="padre">
        <div class="hijo" id="panelLogin">
            <h1>Iniciar sesión</h1>
            <form onsubmit="iniciarSesion(event)">
                <div class="form-fields">
                    <div class="form-field">
                        <label for="username">Usuario:</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-field">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <input type="submit" value="Iniciar sesión">
                </div>
            </form>
        </div>

        <div class="hijo2" id="panelRegistro" hidden>
            <h1>Registro</h1>
            <div class="form-fields">
                <div class="form-field">
                    <label for="usuarioRegistro">Usuario:</label>
                    <input type="text" id="usuarioRegistro">
                </div>
                <div class="form-field">
                    <label for="correoRegistro">Correo:</label>
                    <input type="email" id="correoRegistro">
                </div>
                <div class="form-field">
                    <label for="contrasenaRegistro">Contraseña:</label>
                    <input type="password" id="contrasenaRegistro">
                </div>
                <div class="form-field">
                    <label for="confirmarRegistro">Confirmar contraseña:</label>
                    <input type="password" id="confirmarRegistro">
                </div>
                <button type="button" onclick="registrar()">Registrarse</button>
            </div>
        </div>
    </div>

    <script>
        function mostrarFormulario(cual) {
            let esLogin = cual == "login";

            document.getElementById("panelLogin").hidden = !esLogin;
            document.getElementById("panelRegistro").hidden = esLogin;

            let btnLogin = document.getElementById("btnLogin");
            let btnRegistro = document.getElementById("btnRegistro");

            btnLogin.classList.toggle("activo", esLogin);
            btnRegistro.classList.toggle("activo", !esLogin);
            btnLogin.setAttribute("aria-pressed", esLogin);
            btnRegistro.setAttribute("aria-pressed", !esLogin);
        }

        function obtenerUsuarios() {
            let datos;

            try {
                datos = localStorage.getItem("usuarios");
            } catch (error) {
                if (!(error instanceof DOMException)) throw error;
                alert("El navegador bloqueó el acceso al almacenamiento. Abre la página desde un servidor local e inténtalo de nuevo.");
                return null;
            }

            if (datos === null) return [];

            let usuarios;
            try {
                usuarios = JSON.parse(datos);
            } catch (error) {
                if (!(error instanceof SyntaxError)) throw error;
                alert("Los datos guardados están dañados. No se modificaron; borra la clave «usuarios» del almacenamiento del sitio para volver a registrarte.");
                return null;
            }

            if (!Array.isArray(usuarios) || !usuarios.every(function (user) {
                return user && typeof user.usuario == "string" && typeof user.contrasena == "string";
            })) {
                alert("Los datos guardados no tienen un formato válido. No se modificaron; borra la clave «usuarios» del almacenamiento del sitio para volver a registrarte.");
                return null;
            }

            return usuarios;
        }

        function guardarUsuarios(usuarios) {
            try {
                localStorage.setItem("usuarios", JSON.stringify(usuarios));
                return true;
            } catch (error) {
                if (!(error instanceof DOMException)) throw error;
                if (error.name == "QuotaExceededError") {
                    alert("No se pudo guardar: el almacenamiento del navegador está lleno.");
                } else {
                    alert("El navegador bloqueó el guardado. Abre la página desde un servidor local e inténtalo de nuevo.");
                }
                return false;
            }
        }

        function registrar() {
            let usuario = document.getElementById("usuarioRegistro").value.trim();
            let correo = document.getElementById("correoRegistro").value.trim();
            let contrasena = document.getElementById("contrasenaRegistro").value;
            let confirmar = document.getElementById("confirmarRegistro").value;

            if (
                usuario == "" ||
                correo == "" ||
                contrasena == "" ||
                confirmar == ""
            ) {
                alert("Debe llenar todos los campos");
                return;
            }

            if (contrasena != confirmar) {
                alert("Las contraseñas no coinciden");
                return;
            }

            let usuarios = obtenerUsuarios();
            if (usuarios === null) return;

            let usuarioExiste = usuarios.find(function (user) {
                return user.usuario == usuario;
            });

            if (usuarioExiste) {
                alert("Ese usuario ya existe");
                return;
            }

            let nuevoUsuario = {
                usuario: usuario,
                correo: correo,
                contrasena: contrasena
            };

            usuarios.push(nuevoUsuario);

            if (!guardarUsuarios(usuarios)) return;

            alert("Usuario registrado correctamente");
            mostrarFormulario("login");

            document.getElementById("usuarioRegistro").value = "";
            document.getElementById("correoRegistro").value = "";
            document.getElementById("contrasenaRegistro").value = "";
            document.getElementById("confirmarRegistro").value = "";
        }

        function iniciarSesion(event) {
            event.preventDefault();

            let usuario = document.getElementById("username").value.trim();
            let contrasena = document.getElementById("password").value;

            let usuarios = obtenerUsuarios();
            if (usuarios === null) return;

            let usuarioEncontrado = usuarios.find(function (user) {
                return user.usuario == usuario &&
                    user.contrasena == contrasena;
            });

            if (usuarioEncontrado) {
                alert("Inicio de sesión correcto");
                window.location.href = "index2.html";
            } else {
                alert("Usuario o contraseña incorrectos");
            }
        }
    </script>

    <div class="contacto pie-simple">
        <div class="pie-marca">
            <img src="imagenes/Solo logotipo.png" alt="Logo GiroVolt" width="120" height="80">
            <div class="pie-texto">
                <p class="pie-nombre">GiroVolt</p>
                <p class="pie-slogan">Moviendo el futuro sin contaminar el presente</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
